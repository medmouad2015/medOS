<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pebble OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
:root{--bg:#f2f4f7;--fg:#14181f;--card:#fff;--mut:#6b7482;--acc:#1f7a6d;--out:#cfd5de;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a21;--fg:#eef1f5;--card:#222933;--mut:#98a2b0;--acc:#4fc3ae;--out:#0b0e12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a21;--fg:#eef1f5;--card:#222933;--mut:#98a2b0;--acc:#4fc3ae;--out:#0b0e12;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{display:grid;place-items:center;background:var(--out);color:var(--fg);font-family:"Roboto",system-ui,"Segoe UI",sans-serif;touch-action:manipulation}
#phone{position:relative;width:min(390px,100vw);height:min(800px,100%);border-radius:36px;overflow:hidden;border:7px solid #0c0f13;background:#000;box-shadow:0 20px 60px #0006}
@media(max-width:500px){#phone{border:0;border-radius:0;width:100%;height:100%}}
.layer{position:absolute;inset:0}
#wall{background:var(--w,linear-gradient(160deg,#1f7a6d,#183b5c))}
#sb{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) 18px 6px;font-size:13px;color:#fff;cursor:pointer;text-shadow:0 1px 3px #0006}
#sb.dk{color:var(--fg);text-shadow:none}
#lock{z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;background:#0003;transition:transform .35s}
#lock.up{transform:translateY(-105%)}
#lock .t{font-size:76px;font-weight:300;letter-spacing:-2px}
#lock .d{font-size:16px;opacity:.9}
#lock .h{position:absolute;bottom:70px;font-size:13px;opacity:.8}
#home{z-index:5;padding:calc(48px + env(safe-area-inset-top,0px)) 16px 64px;color:#fff;display:flex;flex-direction:column}
#hdl{margin:auto auto 10px;background:none;border:0;color:#fff;opacity:.8;font:inherit;font-size:12px;cursor:pointer}
#dock{display:flex;justify-content:space-around;padding:10px 0;border-radius:32px;background:#ffffff26;backdrop-filter:blur(10px)}
#dock .ic i{width:52px;height:52px}
#sp{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:30px;padding:14px 20px;background:var(--card);color:var(--mut);font:inherit;font-size:15px;cursor:pointer;margin-top:12px;text-align:left}
#drawer{z-index:8;background:var(--bg);display:none;flex-direction:column;padding:calc(48px + env(safe-area-inset-top,0px)) 16px 64px}
#drawer.on{display:flex;animation:up .22s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#dq{border:0;border-radius:30px;padding:14px 20px;background:var(--card);color:var(--fg);font:inherit;font-size:16px;outline:none;margin-bottom:18px}
#dg{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;overflow:auto;align-content:start}
#dg .ic{color:var(--fg)}
#rec{z-index:12;background:#000c;display:none;flex-direction:column;align-items:center;padding:calc(60px + env(safe-area-inset-top,0px)) 0 70px;color:#fff}
#rec.on{display:flex;animation:pop .18s}
.cards{display:flex;gap:14px;overflow-x:auto;padding:0 40px;width:100%;flex:1;scroll-snap-type:x mandatory;align-items:center}
.rc{flex:none;width:210px;scroll-snap-align:center;cursor:pointer}
.rh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.rh i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px}
.rh button{margin-left:auto;background:none;border:0;color:#fff;font-size:16px;cursor:pointer}
.rb{height:340px;border-radius:26px;display:grid;place-items:center;font-size:64px}
.empty{margin:auto;opacity:.8}
#nt .card{cursor:pointer}
#home .t{font-size:54px;font-weight:300;margin:14px 0 2px}
#home .d{opacity:.9;margin-bottom:26px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer;background:none;border:0;color:#fff;font-family:inherit}
.ic i{font-style:normal;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;box-shadow:0 4px 10px #0004}
.ic:active i{transform:scale(.92)}
#app{z-index:10;background:var(--bg);display:none;flex-direction:column;padding-top:calc(34px + env(safe-area-inset-top,0px));padding-bottom:54px}
#app.on{display:flex;animation:pop .18s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#ah{padding:14px 20px 10px;font-size:30px;font-weight:400}
#ab{flex:1;overflow:auto;padding:0 14px 14px;display:flex;flex-direction:column}
#nav{position:absolute;bottom:0;left:0;right:0;z-index:30;height:54px;display:flex;justify-content:center;gap:54px;align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;opacity:.9;text-shadow:0 1px 3px #0006}
#nav.dk button{color:var(--fg);text-shadow:none}
#shade{z-index:40;background:var(--bg);transform:translateY(-102%);transition:transform .3s;padding:calc(44px + env(safe-area-inset-top,0px)) 16px 16px;height:auto;bottom:auto;border-radius:0 0 26px 26px;box-shadow:0 10px 30px #0006}
#shade.on{transform:none}
.qs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{border:0;border-radius:30px;padding:16px 20px;background:var(--card);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.tile.on{background:var(--acc);color:#fff}
#dim{z-index:60;background:#000;pointer-events:none;opacity:0}
#warm{z-index:59;background:#fff;pointer-events:none;opacity:0;mix-blend-mode:overlay}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.sw{width:46px;height:26px;border-radius:13px;background:var(--out);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--acc)}.sw.on::after{left:23px}
.mut{color:var(--mut);font-size:13px}
.btn{border:0;border-radius:14px;padding:10px 16px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--card);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--acc)}
.wp{display:flex;gap:10px}.wp b{flex:1;height:56px;border-radius:12px;cursor:pointer;border:3px solid transparent}.wp b.on{border-color:var(--fg)}
/* calc */
#cd{margin-top:auto;text-align:right;padding:10px 6px}
#cd .e{color:var(--mut);min-height:22px;font-size:16px}#cd .r{font-size:46px;font-weight:300;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{border:0;border-radius:20px;height:58px;font:inherit;font-size:22px;background:var(--card);color:var(--fg);cursor:pointer}
.keys button.o{background:var(--out)}.keys button.a{background:var(--acc);color:#fff}
/* games */
canvas{width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;border-radius:16px;background:var(--card);touch-action:none}
.bar{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:0 auto;width:100%}
.g4 div{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:24px;background:var(--card)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto;width:100%}
.g3 button,.mc{aspect-ratio:1;border:0;border-radius:14px;background:var(--card);color:var(--fg);font:inherit;font-size:38px;font-weight:700;cursor:pointer}
.mc{font-size:30px}.mc.up{background:var(--acc)}
textarea{flex:1;border:0;border-radius:16px;background:var(--card);color:var(--fg);padding:14px;font:inherit;font-size:16px;resize:none;outline:none}
.dp{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:12px}
.dp button{height:48px;border:0;border-radius:14px;background:var(--card);color:var(--fg);font-size:20px;cursor:pointer}
</style></head><body>
<div id="phone">
<div id="wall" class="layer"></div>
<div id="home" class="layer"><div class="t" id="ht"></div><div class="d" id="hd"></div><div id="grid"></div><button id="hdl">⌃ Swipe up for all apps</button><div id="dock"></div><button id="sp">🔍 Search apps</button></div>
<div id="drawer" class="layer"><input id="dq" placeholder="Search apps" aria-label="Search apps"><div id="dg"></div></div>
<div id="rec" class="layer"></div>
<div id="app" class="layer"><div id="ah"></div><div id="ab"></div></div>
<div id="lock" class="layer"><div class="t" id="lt"></div><div class="d" id="ld"></div><div class="h">Tap to unlock · then swipe up for apps</div></div>
<div id="sb"><span id="st"></span><span id="si">📶 🔋 87%</span></div>
<div id="shade" class="layer"><div class="qs" id="qs"></div><div class="mut" style="margin-bottom:4px">Brightness</div><input type="range" id="br" min="0" max="70" value="0" aria-label="Brightness"><div class="mut" style="margin:14px 0 6px">Notifications · tap one to dismiss</div><div id="nt"></div></div>
<div id="nav"><button id="nb" aria-label="Back">◁</button><button id="nh" aria-label="Home">○</button><button id="nr" aria-label="Close app">□</button></div>
<div id="warm" class="layer"></div><div id="dim" class="layer"></div>
</div>
<script>
const $=s=>document.querySelector(s),S={wifi:true,dark:matchMedia("(prefers-color-scheme:dark)").matches,air:false,night:false,wp:0,dim:0,name:"Pebble One"};
const WP=["linear-gradient(160deg,#1f7a6d,#183b5c)","linear-gradient(160deg,#e07a5f,#3d2c4d)","linear-gradient(160deg,#3a3a52,#0f1020)","linear-gradient(160deg,#9ad0a0,#2b6a8a)"];
let cur=null,openId=null,recent=[];const AC=[["#1f7a6d","#4fc3ae"],["#b4472f","#ff9b80"],["#4f52b8","#a9acff"],["#1f6d9e","#7cc4f2"]];
let NT=[["⚙️","Pebble OS","Welcome! Swipe up on the home screen to see all apps."],["🐍","Snake","Can you beat your high score?"],["⏱️","Clock","Try the stopwatch."]];
function notif(){const n=$("#nt");n.innerHTML="";if(!NT.length)n.append(h("div","mut","No new notifications"));NT.forEach((x,i)=>{const c=h("div","card");c.innerHTML="<b>"+x[0]+" "+x[1]+"</b><div class='mut'>"+x[2]+"</div>";c.onclick=()=>{NT.splice(i,1);notif()};n.append(c)})}
const two=n=>String(n).padStart(2,"0");
function clock(){const d=new Date(),t=two(d.getHours())+":"+two(d.getMinutes()),ds=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
$("#st").textContent=t;$("#lt").textContent=t;$("#ht").textContent=t;$("#ld").textContent=ds;$("#hd").textContent=ds}
setInterval(clock,1000);clock();
function theme(){document.documentElement.dataset.theme=S.dark?"dark":"light";document.documentElement.style.setProperty("--acc",AC[S.wp][S.dark?1:0]);$("#wall").style.setProperty("--w",WP[S.wp]);$("#dim").style.opacity=S.dim/100;$("#warm").style.opacity=S.night?.18:0;$("#si").textContent=(S.air?"✈️":S.wifi?"📶":"🚫")+" 🔋 87%";$("#br").value=S.dim;bars()}
function bars(){const dk=!!openId||$("#drawer").classList.contains("on");$("#sb").classList.toggle("dk",dk);$("#nav").classList.toggle("dk",dk)}
function shadeTiles(){const T=[["wifi","📶 Wi‑Fi"],["dark","🌙 Dark mode"],["air","✈️ Airplane"],["night","🔆 Night light"]];
$("#qs").innerHTML="";T.forEach(([k,l])=>{const b=document.createElement("button");b.className="tile"+(S[k]?" on":"");b.textContent=l;b.onclick=()=>{S[k]=!S[k];if(k=="air"&&S.air)S.wifi=false;theme();shadeTiles()};$("#qs").append(b)})}
$("#sb").onclick=()=>{$("#shade").classList.toggle("on");shadeTiles();notif()};
$("#br").oninput=e=>{S.dim=+e.target.value;theme()};
$("#lock").onclick=()=>$("#lock").classList.add("up");
function home(){if(cur&&cur.stop)cur.stop();cur=null;openId=null;$("#app").classList.remove("on");$("#drawer").classList.remove("on");$("#rec").classList.remove("on");$("#shade").classList.remove("on");bars()}
$("#nh").onclick=()=>{$("#lock").classList.contains("up")?home():0};
$("#nb").onclick=home;$("#nr").onclick=()=>showRec();
function open(id){const a=APPS.find(x=>x.id==id);if(cur&&cur.stop)cur.stop();openId=id;recent=[id,...recent.filter(x=>x!=id)].slice(0,6);$("#drawer").classList.remove("on");$("#rec").classList.remove("on");$("#shade").classList.remove("on");$("#ah").textContent=a.name;$("#ab").innerHTML="";cur={};$("#app").classList.add("on");bars();a.run($("#ab"))}
addEventListener("keydown",e=>{if(cur&&cur.key&&cur.key(e.key)!==false&&e.key.startsWith("Arrow"))e.preventDefault()});
let tx,ty;$("#ab").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$("#ab").addEventListener("touchend",e=>{if(!cur||!cur.key)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;cur.key(Math.abs(dx)>Math.abs(dy)?(dx>0?"ArrowRight":"ArrowLeft"):(dy>0?"ArrowDown":"ArrowUp"))});
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function dpad(el){const d=h("div","dp");[["","",""],["↑","ArrowUp",""],["","",""],["←","ArrowLeft",""],["↓","ArrowDown",""],["→","ArrowRight",""]].forEach(([l,k])=>{const b=h("button","",l);if(!k)b.style.visibility="hidden";else b.onclick=()=>cur.key(k);d.append(b)});el.append(d)}

/* ---------- Apps ---------- */
function calc(el){let ex="";const d=h("div");d.id="cd";const e=h("div","e"),r=h("div","r","0");d.append(e,r);const k=h("div","keys");
const L=["C","(",")","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","⌫","="];
const val=s=>{const q=s.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/%/g,"/100");if(!/^[0-9+\-*/.() ]+$/.test(q))throw 0;const v=Function('"use strict";return ('+q+')')();if(!isFinite(v))throw 0;return +v.toPrecision(12)};
function press(c){if(c=="C"){ex="";e.textContent="";r.textContent="0"}else if(c=="⌫"){ex=ex.slice(0,-1);r.textContent=ex||"0"}else if(c=="="){try{const v=val(ex);e.textContent=ex+" =";ex=String(v);r.textContent=v}catch(_){r.textContent="Error";ex=""}}else{ex+=c;r.textContent=ex}}
L.forEach(c=>{const b=h("button","",c);if("÷×−+".includes(c))b.className="o";if(c=="=")b.className="a";b.onclick=()=>press(c);k.append(b)});
el.append(d,k);cur.key=ky=>{if(/^[0-9.()+\-*/%]$/.test(ky))press(ky=="*"?"×":ky=="/"?"÷":ky=="-"?"−":ky);else if(ky=="Enter")press("=");else if(ky=="Backspace")press("⌫");else return false}}

function settings(el){const c1=h("div","card"),sw=(l,k)=>{const r=h("div","row");r.append(h("span","",l));const b=h("button","sw"+(S[k]?" on":""));b.setAttribute("aria-label",l);b.onclick=()=>{S[k]=!S[k];if(k=="air"&&S.air)S.wifi=false;theme();settings(el)};r.append(b);return r};
el.innerHTML="";c1.append(sw("Wi‑Fi","wifi"),sw("Airplane mode","air"),sw("Dark mode","dark"),sw("Night light","night"));
const c2=h("div","card");c2.append(h("div","","Brightness"));const br=h("input");br.type="range";br.min=0;br.max=70;br.value=S.dim;br.oninput=()=>{S.dim=+br.value;theme()};c2.append(br);
const c3=h("div","card");c3.append(h("div","","Wallpaper"));const w=h("div","wp");WP.forEach((g,i)=>{const b=h("b",i==S.wp?"on":"");b.style.background=g;b.onclick=()=>{S.wp=i;theme();settings(el)};w.append(b)});c3.append(w);
const c4=h("div","card");c4.append(h("div","","Device name"));const n=h("input");n.value=S.name;n.style.cssText="width:100%;margin-top:8px;padding:10px;border-radius:12px;border:1px solid var(--out);background:var(--bg);color:var(--fg);font:inherit";n.oninput=()=>S.name=n.value;c4.append(n);
const c5=h("div","card");c5.innerHTML="<div>About</div><div class='mut' style='margin-top:6px'>Pebble OS 1.0<br>Runs entirely in your browser<br>Storage: 8 apps installed</div>";
el.append(c1,c2,c3,c4,c5)}

function clockApp(el){const big=h("div","",""),b=h("div","card");big.style.cssText="font-size:52px;font-weight:300;text-align:center;margin:14px 0";const sw=h("div","",""),row=h("div","row");sw.style.cssText="font-size:40px;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0";
let t0=0,acc=0,iv=0;const f=ms=>two(ms/60000|0)+":"+two(ms/1000%60|0)+"."+two(ms/10%100|0);sw.textContent=f(0);
const go=h("button","btn","Start"),rs=h("button","btn g","Reset");
go.onclick=()=>{if(iv){clearInterval(iv);iv=0;acc+=Date.now()-t0;go.textContent="Start"}else{t0=Date.now();iv=setInterval(()=>sw.textContent=f(acc+Date.now()-t0),30);go.textContent="Stop"}};
rs.onclick=()=>{clearInterval(iv);iv=0;acc=0;sw.textContent=f(0);go.textContent="Start"};
row.append(go,rs);b.append(h("div","mut","Stopwatch"),sw,row);el.append(big,b);const tick=setInterval(()=>big.textContent=new Date().toLocaleTimeString(),500);big.textContent=new Date().toLocaleTimeString();cur.stop=()=>{clearInterval(tick);clearInterval(iv)}}

function notes(el){const t=h("textarea");t.placeholder="Write something…";try{t.value=localStorage.getItem("pebble-note")||""}catch(_){}t.oninput=()=>{try{localStorage.setItem("pebble-note",t.value)}catch(_){}};el.append(t)}

function snake(el){const N=16,c=h("canvas");c.width=c.height=320;const x=c.getContext("2d"),bar=h("div","bar"),sc=h("span","","Score 0"),rb=h("button","btn","Restart");bar.append(sc,rb);el.append(bar,c);dpad(el);
let s,d,nd,f,sco,iv,dead;const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n);
function init(){s=[[8,8],[7,8],[6,8]];d=nd=[1,0];sco=0;dead=false;food();sc.textContent="Score 0";clearInterval(iv);iv=setInterval(step,120);draw()}
function food(){do f=[Math.random()*N|0,Math.random()*N|0];while(s.some(p=>p[0]==f[0]&&p[1]==f[1]))}
function step(){d=nd;const hd=[s[0][0]+d[0],s[0][1]+d[1]];if(hd[0]<0||hd[1]<0||hd[0]>=N||hd[1]>=N||s.some(p=>p[0]==hd[0]&&p[1]==hd[1])){dead=true;clearInterval(iv);draw();return}
s.unshift(hd);if(hd[0]==f[0]&&hd[1]==f[1]){sco++;sc.textContent="Score "+sco;food()}else s.pop();draw()}
function draw(){const u=20;x.clearRect(0,0,320,320);x.fillStyle="#e0524a";x.fillRect(f[0]*u+3,f[1]*u+3,u-6,u-6);x.fillStyle=css("--acc");s.forEach((p,i)=>{x.globalAlpha=i?.8:1;x.fillRect(p[0]*u+1,p[1]*u+1,u-2,u-2)});x.globalAlpha=1;if(dead){x.fillStyle="#000a";x.fillRect(0,0,320,320);x.fillStyle="#fff";x.font="bold 28px sans-serif";x.textAlign="center";x.fillText("Game over",160,165)}}
rb.onclick=init;cur.key=k=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k];if(!m)return false;if(m[0]+d[0]||m[1]+d[1])nd=m};cur.stop=()=>clearInterval(iv);init()}

function g2048(el){let b,sc=0;const bar=h("div","bar"),s=h("span","","Score 0"),rb=h("button","btn","New game"),g=h("div","g4");bar.append(s,rb);el.append(bar,g,h("div","mut","Swipe or use arrow keys. Merge equal tiles."));dpad(el);
const col={2:"#eee4da",4:"#ede0c8",8:"#f2b179",16:"#f59563",32:"#f67c5f",64:"#f65e3b",128:"#edcf72",256:"#edcc61",512:"#edc850",1024:"#edc53f",2048:"#edc22e"};
function add(){const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)b[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}
function draw(){g.innerHTML="";b.forEach(v=>{const d=h("div","",v||"");if(v){d.style.background=col[v]||"#3c3a32";d.style.color=v>4?"#fff":"#444"}g.append(d)});s.textContent="Score "+sc}
function init(){b=Array(16).fill(0);sc=0;add();add();draw()}
function sl(r){r=r.filter(Boolean);const o=[];for(let i=0;i<r.length;i++){if(r[i]==r[i+1]){o.push(r[i]*2);sc+=r[i]*2;i++}else o.push(r[i])}while(o.length<4)o.push(0);return o}
cur.key=k=>{const d={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[k];if(d==null)return false;const old=b.join();for(let q=0;q<4;q++){let ix=[0,1,2,3].map(j=>d<2?q*4+j:j*4+q);if(d%2)ix.reverse();const r=sl(ix.map(i=>b[i]));ix.forEach((i,j)=>b[i]=r[j])}if(b.join()!=old){add();draw()}};
rb.onclick=init;init()}

function ttt(el){let b,turn,over;const st=h("div","mut","Your turn (X)");st.style.cssText="text-align:center;margin:8px 0 16px;font-size:16px";const g=h("div","g3"),rb=h("button","btn","New game");rb.style.cssText="margin:18px auto 0";el.append(st,g,rb);
const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const win=p=>W.find(w=>w.every(i=>b[i]==p));
function draw(){g.innerHTML="";b.forEach((v,i)=>{const x=h("button","",v);x.onclick=()=>play(i);g.append(x)})}
function end(){const w=win("X")||win("O");if(w){st.textContent=b[w[0]]=="X"?"You win!":"Pebble wins";over=1;return 1}if(b.every(Boolean)){st.textContent="Draw";over=1;return 1}}
function play(i){if(over||b[i])return;b[i]="X";if(!end()){let m=null;for(const p of["O","X"]){for(const w of W){const v=w.map(j=>b[j]);if(v.filter(z=>z==p).length==2&&v.includes("")){m=w[v.indexOf("")];break}}if(m!=null)break}
if(m==null){const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);m=!b[4]?4:e[Math.random()*e.length|0]}b[m]="O";end()}draw()}
function init(){b=Array(9).fill("");over=0;st.textContent="Your turn (X)";draw()}rb.onclick=init;init()}

function memory(el){const E=["🐙","🦊","🌵","🍕","🚀","🎸","🌈","🐝"];let c,open=[],moves=0,lock=false;const bar=h("div","bar"),m=h("span","","Moves 0"),rb=h("button","btn","Shuffle"),g=h("div","g4");bar.append(m,rb);el.append(bar,g);
function init(){c=[...E,...E].sort(()=>Math.random()-.5).map(e=>({e,up:0,done:0}));open=[];moves=0;lock=false;draw()}
function draw(){m.textContent="Moves "+moves;g.innerHTML="";c.forEach((k,i)=>{const b=h("button","mc"+(k.up||k.done?" up":""),k.up||k.done?k.e:"");b.onclick=()=>{if(lock||k.up||k.done)return;k.up=1;open.push(i);if(open.length==2){moves++;lock=true;const[a,z]=open;if(c[a].e==c[z].e){c[a].done=c[z].done=1;c[a].up=c[z].up=0;open=[];lock=false;draw();if(c.every(x=>x.done))m.textContent="Cleared in "+moves+" moves!"}else setTimeout(()=>{c[a].up=c[z].up=0;open=[];lock=false;draw()},700)}if(!(open.length==0&&c.every(x=>x.done)))draw()};g.append(b)})}
rb.onclick=init;init()}

const APPS=[
{id:"calc",name:"Calculator",ic:"🧮",bg:"#e07a5f",run:calc},
{id:"set",name:"Settings",ic:"⚙️",bg:"#5c6b7a",run:settings},
{id:"clk",name:"Clock",ic:"⏱️",bg:"#3d5a80",run:clockApp},
{id:"note",name:"Notes",ic:"📝",bg:"#d9a441",run:notes},
{id:"snk",name:"Snake",ic:"🐍",bg:"#2f8f5b",run:snake},
{id:"g48",name:"2048",ic:"🔢",bg:"#c56a3c",run:g2048},
{id:"ttt",name:"Tic‑Tac‑Toe",ic:"❌",bg:"#6a4c93",run:ttt},
{id:"mem",name:"Memory",ic:"🃏",bg:"#b5446e",run:memory}];
const icon=a=>{const b=h("button","ic");b.innerHTML="<i style='background:"+a.bg+"'>"+a.ic+"</i><span>"+a.name+"</span>";b.onclick=()=>open(a.id);return b};
APPS.filter(a=>["snk","g48","ttt","mem"].includes(a.id)).forEach(a=>$("#grid").append(icon(a)));
["calc","clk","note","set"].forEach(i=>{const b=icon(APPS.find(x=>x.id==i));b.querySelector("span").remove();$("#dock").append(b)});
function fill(t){const g=$("#dg");g.innerHTML="";APPS.filter(a=>a.name.toLowerCase().includes(t.toLowerCase())).forEach(a=>g.append(icon(a)))}
function showDrawer(){$("#rec").classList.remove("on");$("#drawer").classList.add("on");$("#dq").value="";fill("");bars()}
$("#dq").oninput=e=>fill(e.target.value);$("#sp").onclick=showDrawer;$("#hdl").onclick=showDrawer;
let py=0;$("#home").addEventListener("pointerdown",e=>py=e.clientY);$("#home").addEventListener("pointerup",e=>{if(py-e.clientY>60)showDrawer()});
function showRec(){if(cur&&cur.stop)cur.stop();cur=null;openId=null;$("#app").classList.remove("on");$("#drawer").classList.remove("on");$("#shade").classList.remove("on");const r=$("#rec");r.innerHTML="";r.classList.add("on");bars();if(!recent.length){r.append(h("div","empty","No recent apps"));return}
const row=h("div","cards");recent.forEach(id=>{const a=APPS.find(x=>x.id==id),c=h("div","rc"),hd=h("div","rh");hd.innerHTML="<i style='background:"+a.bg+"'>"+a.ic+"</i><span>"+a.name+"</span>";const x=h("button","","✕");x.setAttribute("aria-label","Close "+a.name);x.onclick=e=>{e.stopPropagation();recent=recent.filter(z=>z!=id);showRec()};hd.append(x);const bd=h("div","rb",a.ic);bd.style.background=a.bg;c.append(hd,bd);c.onclick=()=>open(id);row.append(c)});
const cl=h("button","btn","Clear all");cl.style.marginTop="16px";cl.onclick=()=>{recent=[];showRec()};r.append(row,cl)}
theme();shadeTiles();
</script></body></html>
